<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="theme-color" content="#ff5c8a" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..800&display=swap"
      rel="stylesheet"
    />
    <meta
      name="description"
      content="Transform your photos with AI image transformation and curated image-to-image styles. Turn portraits into anime, cartoon, cinematic, cyberpunk, and more."
    />
    <title>AI Image Transformation &amp; Image-to-Image AI | StyleForge</title>

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="StyleForge" />
    <meta property="og:title" content="AI Image Transformation &amp; Image-to-Image AI | StyleForge" />
    <meta
      property="og:description"
      content="Transform your photos with AI image transformation. Upload an image, choose a Style, and create a new visual with image-to-image AI."
    />
    <meta property="og:url" content="https://styleforge.org/" />
    <meta property="og:image" content="https://styleforge.org/hero-portrait.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AI Image Transformation &amp; Image-to-Image AI | StyleForge" />
    <meta
      name="twitter:description"
      content="Transform your photos with AI. Image-to-image AI with curated styles — anime, cartoon, cinematic, cyberpunk, fantasy, Y2K and more."
    />
    <meta name="twitter:image" content="https://styleforge.org/hero-portrait.png" />

    <!-- Structured data: WebApplication -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "StyleForge",
        "url": "https://styleforge.org/",
        "applicationCategory": "MultimediaApplication",
        "operatingSystem": "Web",
        "description": "AI image transformation platform. Transform your photos with curated image-to-image styles and carefully crafted AI prompts.",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
