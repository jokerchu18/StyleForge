<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#ff5c8a" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="canonical" href="https://styleforge.org/" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..800&display=swap"
      rel="stylesheet"
    />
    <meta
      name="description"
      content="Free AI photo stylizer — turn any photo into anime, sci-fi, oil painting, sketch or watercolor in seconds. Cloud AI styles. No account needed."
    />
    <title>StyleForge — Free AI Photo Stylizer: Anime, Sci-Fi & More</title>

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="StyleForge" />
    <meta property="og:title" content="StyleForge — Turn Any Photo Into Anime, Sci-Fi & More" />
    <meta
      property="og:description"
      content="Free AI photo stylizer. Turn any photo into anime, sci-fi, oil painting, sketch or watercolor in seconds with cloud AI styles."
    />
    <meta property="og:url" content="https://styleforge.org/" />
    <meta property="og:image" content="https://styleforge.org/styles/api/anime.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="StyleForge — Turn Any Photo Into Anime, Sci-Fi & More" />
    <meta
      name="twitter:description"
      content="Free AI photo stylizer. Anime, sci-fi, oil painting, sketch, watercolor — in seconds, no account."
    />
    <meta name="twitter:image" content="https://styleforge.org/styles/api/anime.png" />

    <!-- Structured data: WebApplication -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "StyleForge",
        "url": "https://styleforge.org/",
        "applicationCategory": "MultimediaApplication",
        "operatingSystem": "Web",
        "description": "Free AI photo stylizer that turns any photo into anime, sci-fi, oil painting, sketch or watercolor in seconds with cloud AI styles.",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        },
        "aggregateRating": {
          "@type": "AggregateRating",
          "ratingValue": "4.8",
          "ratingCount": "120"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
